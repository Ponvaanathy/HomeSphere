<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | HomeSphere Real Estate</title>
  <meta name="description" content="Create a free HomeSphere account to discover, verify, compare, and post properties.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon"><i class="fas fa-cube"></i></div>
        <span>Home<span class="text-brand">Sphere</span></span>
      </a>
      <div class="nav-actions">
        <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Main Sign Up Form -->
  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <h2>Create HomeSphere Account</h2>
        <p>Join thousands making confident property decisions</p>
      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name *</label>
          <input type="text" id="regName" class="form-input" placeholder="Your full name" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-input" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPhone">Phone Number *</label>
            <input type="tel" id="regPhone" class="form-input" placeholder="+91 00000 00000" required>
          </div>
        </div>



        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label class="form-label" for="regPassword">Password *</label>
            <div style="position: relative;">
              <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required>
              <button type="button" onclick="togglePassVisibility('regPassword', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                <i class="far fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regConfirmPassword">Confirm *</label>
            <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="regSubmitBtn" style="width: 100%; height: 44px; margin-top: 0.5rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="/js/register.js"></script>
</body>
</html>
