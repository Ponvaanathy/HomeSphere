<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Verification Queue | HomeSphere Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon"><i class="fas fa-cube"></i></div>
        <span>Home<span class="gradient-text">Sphere</span> <span class="badge badge-sale" style="font-size:0.75rem;margin-left:0.5rem;">ADMIN</span></span>
      </a>

      <div class="nav-links">
        <a href="/admin/admin-dashboard.html" class="nav-link">Admin Dashboard</a>
        <a href="/admin/manage-users.html" class="nav-link">Users</a>
        <a href="/admin/manage-properties.html" class="nav-link">Listings</a>
        <a href="/admin/verification.html" class="nav-link active">Verifications</a>
      </div>

      <div class="nav-actions">
        <button onclick="handleLogout()" class="btn btn-secondary btn-sm text-rose"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">

      <div class="admin-layout">
        
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar glass-card">
          <nav class="admin-nav">
            <a href="/admin/admin-dashboard.html" class="admin-nav-link">
              <i class="fas fa-chart-pie"></i> Overview & KPIs
            </a>
            <a href="/admin/manage-users.html" class="admin-nav-link">
              <i class="fas fa-users-cog"></i> Manage Users
            </a>
            <a href="/admin/manage-properties.html" class="admin-nav-link">
              <i class="fas fa-building"></i> Manage Properties
            </a>
            <a href="/admin/verification.html" class="admin-nav-link active">
              <i class="fas fa-file-signature"></i> Verification Queue
            </a>
          </nav>
        </aside>

        <!-- Main Content -->
        <div class="admin-main">
          
          <div>
            <h1>Document Verification & <span class="gradient-text">Trust Audits</span></h1>
            <p class="text-secondary">Audit uploaded freehold title deeds, tax receipts, and occupancy permits. Verifications automatically update property Trust Scores.</p>
          </div>

          <!-- Document Queue List -->
          <div id="verificationQueueList" style="display:flex;flex-direction:column;gap:1rem;">
            <div class="spinner"></div>
          </div>

        </div>

      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <script src="/js/admin.js"></script>
  <script>
    function handleLogout() {
      localStorage.removeItem('homesphere_token');
      localStorage.removeItem('homesphere_user');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
